/* RUKA visual polish — additive styles; app logic remains unchanged */
html { scroll-behavior: smooth; }
body { min-height: 100vh; min-height: 100dvh; -webkit-tap-highlight-color: transparent; }
#app { min-height: 100vh; min-height: 100dvh; }
main { padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)); }

@keyframes ruka-rise {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes ruka-pop {
  from { opacity: 0; transform: translateY(12px) scale(.985); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes ruka-modal {
  from { opacity: 0; transform: translateY(18px) scale(.985); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes ruka-toast {
  from { opacity: 0; transform: translate(-50%, 8px); }
  to { opacity: 1; transform: translate(-50%, 0); }
}

main > .hd, main > h1 { animation: ruka-rise .38s ease both; }
main .cd, main .it, main .dy {
  animation: ruka-pop .34s cubic-bezier(.2,.7,.2,1) both;
}
main .cd { box-shadow: 0 5px 18px rgba(20, 24, 16, .035); }
.cd, .it, .pc, .b, .ic, .ni, .fab, .dy, .tabs button {
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease,
              background-color .18s ease, opacity .18s ease;
}
@media (hover:hover) {
  .cd:hover, .it:hover { box-shadow: 0 10px 26px rgba(20, 24, 16, .075); }
  .pc:hover { transform: translateY(-3px); }
  .b:hover, .ic:hover { transform: translateY(-1px); }
}
button:active, .it:active, .pc:active { transform: scale(.985); }
.b.p:hover, .fab:hover { box-shadow: 0 8px 22px rgba(167, 245, 8, .22); }
.fab { transition: transform .18s ease, box-shadow .18s ease; }
.fab:active { transform: scale(.92); }

.ov {
  backdrop-filter: blur(7px);
  -webkit-backdrop-filter: blur(7px);
  animation: ruka-rise .2s ease both;
}
.md { animation: ruka-modal .28s cubic-bezier(.2,.75,.25,1) both; }
.tst { animation: ruka-toast .22s ease both; }
.pb i { transition: width .55s cubic-bezier(.2,.7,.2,1); }
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--s);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--s) 16%, transparent);
}
.bn {
  padding-left: max(4px, env(safe-area-inset-left, 0px));
  padding-right: max(4px, env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--sf) 88%, transparent);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
    transition-duration: .01ms !important;
  }
}

function cal(){const y=cm.getFullYear(),m=cm.getMonth(),off=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate(),t=T();let c=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="w">${x}</div>`).join('')+'<div></div>'.repeat(off);for(let i=1;i<=n;i++){const d=iso(new Date(y,m,i));c+=`<button class="dy ${d==t?'td':''}" data-a="day" data-d="${d}" aria-label="${d}"><b>${i}</b><span class="dts">${items(d).slice(0,4).map(x=>`<i style="background:${x.c}"></i>`).join('')}</span></button>`}
return`<div class="hd"><h1>${cm.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</h1><div class="row" style="margin:0"><button class="ic" data-a="mo" data-n="-1" aria-label="Previous month">${ic('l')}</button><button class="b" data-a="tod">Today</button><button class="ic" data-a="mo" data-n="1" aria-label="Next month">${ic('r')}</button></div></div><div class="cal">${c}</div><p><small>Tap a day to see items or add an event. Dots: yellow task deadline, purple project deadline, cyan meeting, pink revision, lime delivery.</small></p>`}
function nlist(){const l=S.notes.filter(n=>(n.title+n.body+n.tags+n.cat).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>(b.pin||0)-(a.pin||0)||b.u.localeCompare(a.u));return l.map(n=>`<div class="it" data-a="sel" data-id="${n.id}" style="${n.id==nid?'border-color:var(--s)':''}"><b>${n.pin?'📌 ':''}${e(n.title||'Untitled')}</b><small>${new Date(n.u).toLocaleDateString('en-GB',{day:'numeric',month:'short'})} ${e(n.body.slice(0,50))}</small></div>`).join('')||em('No notes yet.')}
function notes(){const n=S.notes.find(x=>x.id==nid);return`<div class="hd"><h1>Notes</h1></div><div class="nt ${n?'ed':''}"><div class="nl"><input class="sr" placeholder="Search notes" data-in="q" value="${e(q)}" style="margin-bottom:10px"><div id="nl">${nlist()}</div></div><div class="ne">${n?`<div class="row" style="margin:0 0 14px"><button class="b bk" data-a="bk">Back</button><button class="b" data-a="pinn">${n.pin?'Unpin':'Pin'}</button><button class="b d" data-a="dnote">Delete</button><small id="nst" style="align-self:center">Saved</small></div><input class="ti" data-in="title" placeholder="Title" value="${e(n.title)}"><small>Created ${new Date(n.c).toLocaleDateString('en-GB')}, updated ${new Date(n.u).toLocaleDateString('en-GB')}</small><input class="tg" data-in="tags" placeholder="Tags, comma separated" value="${e(n.tags)}"><input class="tg" data-in="cat" placeholder="Category" value="${e(n.cat)}"><textarea class="bo" data-in="body" placeholder="Start writing">${e(n.body)}</textarea>`:em('Select a note or tap + to write one.')}</div></div>`}
function finance(){const f=tab.fin,I=S.invoices,mo=T().slice(0,7);let h='';
if(f=='Overview'){const pays=I.flatMap(i=>i.pays),ms=[...Array(6)].map((_,k)=>{const d=new Date();d.setMonth(d.getMonth()-5+k,1);const key=iso(d).slice(0,7);return{l:d.toLocaleDateString('en-GB',{month:'short'}),v:pays.filter(p=>p.date.startsWith(key)).reduce((a,p)=>a+p.amt,0)}}),mx=Math.max(...ms.map(x=>x.v),1),cnt=s=>I.filter(i=>st(i)==s).length;
h=`<div class="gr">${[['Monthly income',R(pays.filter(p=>p.date.startsWith(mo)).reduce((a,p)=>a+p.amt,0))],['Total project value',R(I.reduce((a,i)=>a+i.total,0))],['Outstanding balance',R(I.reduce((a,i)=>a+Math.max(rem(i),0),0))],['Paid invoices',cnt('Paid')],['Partially paid',cnt('Partially Paid')],['Unpaid',cnt('Unpaid')]].map(x=>`<div class="cd"><small>${x[0]}</small><b class="big">${x[1]}</b></div>`).join('')}</div><div class="cd" style="margin-top:14px"><h2>Income, last 6 months</h2><div class="bars">${ms.map(x=>`<div>${x.v?R(x.v/1e6*1e6).replace('Rp',''):''}<i style="height:${x.v/mx*100}%"></i>${x.l}</div>`).join('')}</div></div>`}
else if(f.startsWith('Unpaid'))h=`<div class="row" style="margin:0 0 12px"><button class="b p" data-a="ninv">Create invoice</button></div>`+(I.map(i=>`<div class="it" data-a="inv" data-id="${i.id}"><div class="g"><b>${e(i.no)}, ${e(i.client)}</b><small>Total ${R(i.total)}, remaining ${R(Math.max(rem(i),0))}, due ${fd(i.due)}</small></div>${bd(st(i),SC[st(i)])}</div>`).join('')||em('No invoices yet.'));
else{const H=[];I.forEach(i=>{H.push({d:i.date,t:'Invoice created',s:i.no+', '+R(i.total),id:i.id});let run=0;[...i.pays].sort((a,b)=>a.date.localeCompare(b.date)).forEach(p=>{run+=p.amt;H.push({d:p.date,t:p.dp?'Down payment received':run>=i.total?'Final payment received':'Partial payment received',s:i.no+', '+R(p.amt),id:i.id})})});H.sort((a,b)=>b.d.localeCompare(a.d));h=H.map(x=>`<div class="it" data-a="inv" data-id="${x.id}"><div class="g"><b>${x.t}</b><small>${e(x.s)}</small></div><small>${fd(x.d)}</small></div>`).join('')||em('No history yet.')}
return`<h1>Finance</h1><div class="tabs">${['Overview','Unpaid & Invoice','History'].map(x=>`<button class="${f==x?'on':''}" data-a="tab" data-k="fin" data-v="${x}">${x}</button>`).join('')}</div>${h}`}
function settings(){const s=S.set,PR=[['RUKA','#A7F508,#B217F3'],['Ocean','#03E1F6,#B217F3'],['Sunset','#F31752,#EBF00F']];return`<h1>Settings</h1><div class="g2"><div class="cd"><h2>Appearance</h2><div class="tabs">${['light','dark','system'].map(x=>`<button class="${s.theme==x?'on':''}" data-a="th" data-v="${x}">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div><div class="row" style="margin:0 0 12px">${PR.map(x=>`<button class="b" data-a="pre" data-v="${x[1]}">${x[0]}</button>`).join('')}</div><label>Primary<input type="color" value="${s.p}" onchange="S.set.p=this.value;commit()"></label><label>Secondary<input type="color" value="${s.s}" onchange="S.set.s=this.value;commit()"></label><button class="b" data-a="rst">Restore default RUKA palette</button></div>
<div class="cd"><h2>Google Drive</h2><p>${bd('Not connected','#F31752')}</p><small>Sync is not available in this hosted version. Data is stored on this device.</small><div class="row"><button class="b p" data-a="drv">Connect Google Drive</button></div></div>
<div class="cd"><h2>Data</h2><div class="row" style="margin:0"><button class="b" data-a="exp">Export / backup</button><button class="b" data-a="imp">Import / restore</button><button class="b d" data-a="clr">Clear demo data</button></div></div>
<div class="cd"><h2>About RUKA</h2><p><b>RUKA</b>, Your Creative Workspace<br><small>Version 0.1. Local-first workspace for freelance design work.</small></p></div></div>`}
const more=()=>`<h1>More</h1><div class="gr">${MORE.map(x=>`<button class="cd" data-a="nav" data-v="${x[0]}" style="display:flex;gap:12px;align-items:center;font-weight:700">${ic(x[2])}${x[1]}</button>`).join('')}</div>`;
const PG={dash,tasks,projects,cal,notes,finance,settings,more};
function render(){const on=v=>v==view||(v=='more'&&MORE.some(x=>x[0]==view))?'on':'',ni=n=>`<button class="ni ${on(n[0])}" data-a="nav" data-v="${n[0]}">${ic(n[2])}<span>${n[1]}</span></button>`;
$('app').innerHTML=`<aside class="sb"><div class="lg"> <img src="./ruka-logo.png" alt="RUKA"> </div>${[...NAV.slice(0,4),...MORE].map(ni).join('')}</aside><main>${PG[view]()}</main><nav class="bn">${NAV.map(ni).join('')}</nav>${['dash','tasks','projects','notes'].includes(view)&&!(view=='notes'&&nid)?`<button class="fab" data-a="add" aria-label="Add">${ic('plus')}</button>`:''}`;tick()}
const tick=()=>{const c=$('clk');if(c)c.textContent=new Date().toLocaleTimeString('en-GB')};setInterval(tick,1000);
load().then(d=>{S=d&&d.set?d:seed();if(!d)persist();theme();render()});
matchMedia('(prefers-color-scheme:dark)').addEventListener?.('change',()=>S&&theme());
</script><script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch((error) => {
      console.warn('RUKA offline support could not be enabled:', error);
    });
  });
}
</script>
</body></html>
